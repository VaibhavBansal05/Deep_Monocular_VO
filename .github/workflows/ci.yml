name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: deep-monocular-vo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check mvo scripts tests
      - name: Test
        run: pytest -q
