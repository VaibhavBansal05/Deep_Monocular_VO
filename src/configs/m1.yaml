# Model 1 -- Classical ORB/Lucas-Kanade + MLP.  OWNER: Pranav Joshi
model:
  detector: orb          # orb | shitomasi
  max_features: 1000
  grid: [8, 8]           # flow field binned into an 8x8 grid
  hidden: [512, 256, 128]
  dropout: 0.2
batch_size: 64           # features are precomputed -> big batches are free
lr: 1.0e-3
epochs: 100
augment: false           # augmentation happens before feature extraction
