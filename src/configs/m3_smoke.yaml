# CPU contract check only: random encoders, one scale, no training-result claims.
model:
  seq_len: 3
  backbone: resnet18
  pretrained: false
  num_scales: 1
  min_depth: 0.1
  max_depth: 100.0
  ssim_weight: 0.85
  smooth_weight: 1.0e-3
  automask: true
  min_reproj: true
batch_size: 2
num_workers: 0
epochs: 1
lr: 1.0e-4
amp: false
augment: false
device: cpu
scheduler: none
selection_key: total
