# Model 4 -- CNN + CBAM/SE attention.  OWNER: Vaibhav Krishna Bansal
model:
  backbone: resnet18
  pretrained: true
  # none is the ablation baseline and trains today; cbam/se land on m4/cbam.
  # Switch this to cbam once that branch merges.
  attention: none        # cbam | se | none  (none = the controlled ablation)
  reduction: 16
  spatial_kernel: 7
  dropout: 0.2
  whiten: true           # whitened pose targets; see mvo/common/data/pose_stats.py
  rot_weight: 1.0        # whitening makes the axes commensurate
seq_len: 2
batch_size: 16
lr: 1.0e-4
epochs: 60
