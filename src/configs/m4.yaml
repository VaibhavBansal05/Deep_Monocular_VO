# Model 4 -- CNN + CBAM/SE attention.  OWNER: Vaibhav Krishna Bansal
model:
  seq_len: 2
  backbone: resnet18
  pretrained: true
  attention: cbam        # cbam | se | none  (none = the controlled ablation)
  attention_residual: true   # gated residual protects pretrained features
  attention_gate_init: 0.1   # early gradients without abruptly halving features
  reduction: 16
  spatial_kernel: 7
  dropout: 0.2
  standardize: true      # output parameterisation; covariance is not whitened
  rot_weight: 1.0        # group-normalised geodesic rotation term
  bias_weight: 0.1       # penalise signed per-step residual that causes drift
batch_size: 16
lr: 1.0e-4
epochs: 60
# T4 FP16 backward produced non-finite gradients before the first update.
# Keep the supervised geometric-pose runs in full FP32 for reliable training.
amp: false
