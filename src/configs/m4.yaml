# Model 4 -- CNN + CBAM/SE attention.  OWNER: Vaibhav Krishna Bansal
model:
  seq_len: 2
  backbone: resnet18
  pretrained: true
  attention: cbam        # cbam | se | none  (none = the controlled ablation)
  attention_residual: true   # zero-init gate: identity at init, so inserting
                             # attention does not disturb the pretrained
                             # backbone before training. false = paper-faithful.
  reduction: 16
  spatial_kernel: 7
  dropout: 0.2
  whiten: true           # whitened pose targets; see mvo/common/data/pose_stats.py
  rot_weight: 1.0        # whitening makes the axes commensurate
batch_size: 16
lr: 1.0e-4
epochs: 60
