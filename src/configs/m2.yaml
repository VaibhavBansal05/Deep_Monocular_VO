# Model 2 -- CNN (ResNet18) + GRU/LSTM.  OWNER: Abhishek Laxman Jadhav
model:
  seq_len: 5
  backbone: resnet18
  pretrained: true
  rnn: lstm              # lstm | gru | none  (none = ablation)
  hidden_size: 512
  num_layers: 2
  dropout: 0.2
  standardize: true      # output parameterisation; covariance is not whitened
  rot_weight: 1.0        # group-normalised geodesic rotation term
  bias_weight: 0.1       # penalise signed per-step residual that causes drift
batch_size: 8
lr: 1.0e-4
epochs: 60
